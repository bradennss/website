apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: presence
spec:
  selector:
    app: presence
  ports:
    - name: http
      port: 3000
      targetPort: http
