name: Build and Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - deploy/**
  workflow_dispatch:

concurrency:
  group: build-and-push
  cancel-in-progress: false

permissions:
  contents: write

env:
  IMAGE_REPOSITORY: ${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_REGISTRY_PROJECT }}
  REGISTRY_HOST: ${{ vars.DOCKER_REGISTRY }}
  REGISTRY_PROJECT: ${{ vars.DOCKER_REGISTRY_PROJECT }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Sable registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - id: web-image
        name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - id: presence-image
        name: Build and push presence image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/presence/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/presence:${{ github.sha }}
          cache-from: type=gha,scope=presence
          cache-to: type=gha,mode=max,scope=presence
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.37.0
      - name: Render deployment manifest
        env:
          WEB_IMAGE: ${{ env.IMAGE_REPOSITORY }}/web@${{ steps.web-image.outputs.digest }}
          PRESENCE_IMAGE: ${{ env.IMAGE_REPOSITORY }}/presence@${{ steps.presence-image.outputs.digest }}
          PRESENCE_SERVER_URL: ${{ vars.PRESENCE_SERVER_URL }}
        run: |
          : "${REGISTRY_HOST:?Set the DOCKER_REGISTRY repository variable}"
          : "${REGISTRY_PROJECT:?Set the DOCKER_REGISTRY_PROJECT repository variable}"
          : "${PRESENCE_SERVER_URL:?Set the PRESENCE_SERVER_URL repository variable}"
          pnpm --filter @braden-lol/deployment-tooling render \
            --template deploy/workloads.yaml.eta \
            --output deploy/production/workloads.yaml
          kubectl kustomize deploy/production >/dev/null
      - name: Publish deployment revision
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_REVISION" ]; then
            echo "A newer main revision exists; its workflow will publish the deployment."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/production/workloads.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy $SOURCE_REVISION"
          git push origin HEAD:main
