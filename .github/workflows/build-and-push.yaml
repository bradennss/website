name: Build and Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - deploy/**
  workflow_dispatch:

concurrency:
  group: build-and-push
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/bradennss/website

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - web
          - presence
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "${{ matrix.app }}.digest"
      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.app }}
          path: ${{ matrix.app }}.digest
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish deployment revision
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.37.0
      - name: Render deployment manifest
        env:
          WEB_IMAGE: ${{ env.IMAGE_REPOSITORY }}/web
          PRESENCE_IMAGE: ${{ env.IMAGE_REPOSITORY }}/presence
          PRESENCE_SERVER_URL: ${{ vars.PRESENCE_SERVER_URL }}
        run: |
          : "${PRESENCE_SERVER_URL:?Set the PRESENCE_SERVER_URL repository variable}"
          WEB_IMAGE="$WEB_IMAGE@$(<digests/web.digest)"
          PRESENCE_IMAGE="$PRESENCE_IMAGE@$(<digests/presence.digest)"
          export WEB_IMAGE PRESENCE_IMAGE
          pnpm --filter @braden-lol/deployment-tooling render \
            --template deploy/workloads.yaml.eta \
            --output deploy/production/workloads.yaml
          kubectl kustomize deploy/production >/dev/null
      - name: Propose deployment revision
        env:
          SOURCE_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_REVISION" ]; then
            echo "A newer main revision exists; its workflow will publish the deployment."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/production/workloads.yaml
          git diff --cached --quiet && exit 0
          branch="release/$SOURCE_REVISION"
          git checkout -b "$branch"
          git commit -m "Deploy $SOURCE_REVISION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Deploy ${SOURCE_REVISION:0:12}" \
            --body "Deploy both GHCR images by immutable digest. Flux reconciles after merge."
